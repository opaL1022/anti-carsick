name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA for SideStore
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/sender_flutter

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign
          mkdir -p output/Payload
          cp -R build/ios/iphoneos/Runner.app output/Payload/
          (
            cd output
            zip -qry ../motion_sender.ipa Payload
          )

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: motion_sender-ios
          path: apps/sender_flutter/motion_sender.ipa
          retention-days: 1
